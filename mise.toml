[tasks.qemu]
description = "Build the kernel and init program and boot them in QEMU through Multiboot, with serial output on the console"
run = """
cargo build
! readelf -rW target/x86_64-unknown-none/debug/kernel | grep -q R_X86_64_
qemu-system-x86_64 \
    -machine q35 \
    -m 1G \
    -kernel target/x86_64-unknown-none/debug/kernel \
    -initrd target/tests/x86_64-unknown-none/debug/init \
    -net none \
    -display gtk -serial stdio -no-reboot -no-shutdown
"""
