[package]
name = "re-mach"
version = "0.1.0"
edition = "2024"
authors = ["Leonardo Lopes Pereira <leonardolopespereira@outlook.com>"]
license = "GPL-2.0-or-later"
description = "A reimplementation of the Mach microkernel in Rust"
repository = "https://github.com/llp42/re-mach"
publish = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
intrusive-collections = { version = "0.10", default-features = false }
lock_api = { version = "0.4", default-features = false }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
