# Cargo configuration for building the re-mach kernel as a freestanding
# (no_std, no_main) UEFI application for the official x86_64-unknown-uefi
# target -- prebuilt by upstream (Tier 2), so no custom target-spec JSON and
# no -Z build-std needed.
#
# The kernel is a PE/COFF EFI application: UEFI firmware loads and relocates
# it, then calls efi_main in 64-bit long mode. No linker script, no
# intermediate bootloader, and no BIOS trampoline are involved in this
# initial x86_64/UEFI target. Architecture and boot scope: adrs/README.md.

[build]
target = "x86_64-unknown-uefi"
