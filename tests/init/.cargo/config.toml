# A static user-space executable for x86_64-unknown-none, linked at a fixed
# address in the low half. The target defaults to the kernel code model and
# position-independent executables, which do not fit a user program.
[build]
target = "x86_64-unknown-none"
target-dir = "../../target/tests"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=small",
    "-C", "link-arg=--image-base=0x400000",
]
